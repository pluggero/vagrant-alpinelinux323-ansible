---
name: Build and Release

on:
  schedule:
    # Run every Sunday at 1 AM UTC
    - cron: "0 1 * * 0"
  workflow_dispatch:

env:
  PACKER_OUTPUT: packer/outputs/alpinelinux323-virtualbox-amd64/alpinelinux323-virtualbox.box
  BOX_NAME: alpinelinux323-ansible
  PROVIDER: virtualbox
  ARCHITECTURE: amd64
  VBOX_VERSION: "7.2.22"
  VBOX_GUEST_VERSION: "7.2.22"

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    needs: lint
    with:
      upload-artifact: true

  release:
    name: Release to Hetzner Object Storage
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download box artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vagrant-box
          path: ./box

      - name: Set Release Version
        id: set_version
        run: |
          # Use YYYY.MM.DD format for version
          VERSION=$(date -u +"%Y.%m.%d")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get commit SHA and workflow URL
        id: build_metadata
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "workflow_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Prepare box upload
        id: prepare_box
        env:
          HETZNER_S3_BUCKET: ${{ vars.HETZNER_S3_BUCKET }}
          HETZNER_S3_ENDPOINT: ${{ vars.HETZNER_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          source scripts/box_catalog.sh

          BOX_NAME="${{ env.BOX_NAME }}"
          VERSION="${{ steps.set_version.outputs.version }}"
          PROVIDER="${{ env.PROVIDER }}"
          ARCHITECTURE="${{ env.ARCHITECTURE }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          CATALOG_URL="${HETZNER_S3_ENDPOINT}/${HETZNER_S3_BUCKET}/${BOX_NAME}/metadata.json"

          echo "Fetching existing catalog for '$BOX_NAME'..."
          catalog=$(fetch_catalog "$BOX_NAME" "$REPO_URL" "$CATALOG_URL")

          if [[ "$(provider_exists "$catalog" "$VERSION" "$PROVIDER" "$ARCHITECTURE")" == "true" ]]; then
            echo "Version already exists."
            echo "skip_upload=true" >> $GITHUB_OUTPUT
          else
            echo "Version does not exist. Preparing version '$VERSION'..."

            echo "Calculating box checksum..."
            checksum=$(sha256sum ./box/alpinelinux323-virtualbox.box | awk '{print $1}')
            echo "Checksum: $checksum"

            echo "Creating checksums file with metadata..."
            {
              echo "$checksum  alpinelinux323-virtualbox.box"
              echo ""
              echo "Build Metadata"
              echo "- Version: $VERSION"
              echo "- Git commit: ${{ steps.build_metadata.outputs.commit_sha }}"
              echo "- Workflow run: ${{ steps.build_metadata.outputs.workflow_url }}"
              echo "- Build date: $(date --utc +"%Y-%m-%d %H:%M:%S UTC")"
              echo "- VirtualBox version: $VBOX_VERSION"
              echo "- VirtualBox Guest Additions version: $VBOX_GUEST_VERSION"
              echo ""
              echo "Repository: $REPO_URL"
            } > ./box/checksums.txt
            echo "Checksums file created."

            echo "$checksum" > /tmp/checksum.txt
            echo "skip_upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Attest checksums file
        if: steps.prepare_box.outputs.skip_upload == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ./box/checksums.txt

      - name: Upload checksums as artifact
        if: steps.prepare_box.outputs.skip_upload == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksums-${{ steps.set_version.outputs.version }}
          path: ./box/checksums.txt

      - name: Upload box
        if: steps.prepare_box.outputs.skip_upload == 'false'
        env:
          HETZNER_S3_BUCKET: ${{ vars.HETZNER_S3_BUCKET }}
          HETZNER_S3_ENDPOINT: ${{ vars.HETZNER_S3_ENDPOINT }}
          # aws CLI only reads creds from these exact env var names.
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          source scripts/box_catalog.sh

          BOX_NAME="${{ env.BOX_NAME }}"
          VERSION="${{ steps.set_version.outputs.version }}"
          PROVIDER="${{ env.PROVIDER }}"
          ARCHITECTURE="${{ env.ARCHITECTURE }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          CATALOG_URL="${HETZNER_S3_ENDPOINT}/${HETZNER_S3_BUCKET}/${BOX_NAME}/metadata.json"
          BOX_S3_KEY="${BOX_NAME}/${VERSION}/${PROVIDER}/${ARCHITECTURE}/alpinelinux323-virtualbox.box"
          BOX_URL="${HETZNER_S3_ENDPOINT}/${HETZNER_S3_BUCKET}/${BOX_S3_KEY}"
          checksum=$(cat /tmp/checksum.txt)

          echo "Starting upload of box '$BOX_NAME' version '$VERSION'..."

          echo "Uploading box file..."
          aws s3 cp --endpoint-url "$HETZNER_S3_ENDPOINT" \
            ./box/alpinelinux323-virtualbox.box "s3://${HETZNER_S3_BUCKET}/${BOX_S3_KEY}"
          echo "Box upload completed."

          echo "Updating catalog..."
          catalog=$(fetch_catalog "$BOX_NAME" "$REPO_URL" "$CATALOG_URL")
          provider_json=$(jq -n \
            --arg provider "$PROVIDER" \
            --arg url "$BOX_URL" \
            --arg checksum "$checksum" \
            --arg arch "$ARCHITECTURE" \
            '{name: $provider, url: $url, checksum: $checksum, checksum_type: "sha256", architecture: $arch, default_architecture: true}')
          updated_catalog=$(merge_provider "$catalog" "$VERSION" "$provider_json")
          echo "$updated_catalog" | jq empty
          echo "$updated_catalog" > /tmp/catalog.json

          aws s3 cp --endpoint-url "$HETZNER_S3_ENDPOINT" --content-type application/json \
            /tmp/catalog.json "s3://${HETZNER_S3_BUCKET}/${BOX_NAME}/metadata.json"

          echo "Box version released successfully!"

  tag:
    name: Create and Push Tag
    uses: ./.github/workflows/_tag.yml
    needs: release
    permissions:
      contents: write
    with:
      version: ${{ needs.release.outputs.version }}
