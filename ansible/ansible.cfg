[defaults]
roles_path = ./roles
host_key_checking = False
callbacks_enabled = ansible.posix.timer, ansible.posix.profile_tasks, ansible.posix.profile_roles

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
# pipelining = True  # holding off: verify sudoers has no `requiretty` for the ssh user before enabling (see alpinelinux323.pkr.hcl)

[callback_profile_roles]
summary_only = True
